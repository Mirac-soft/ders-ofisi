<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Ders Ofisi — NYC</title>
  <link rel="stylesheet" href="stil.css">
  <link rel="icon" href="ikon.png">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
  </script>
</head>
<body>
  <header id="ust">
    <strong>🏙️ Ders Ofisi</strong>
    <select id="ders-sec" aria-label="Ders seç"></select>
    <button id="ders-ekle" title="Yeni ders">＋ Ders</button>
    <label id="pdf-alan" title="PDF'i buraya bırak ya da tıkla">📄 PDF bırak
      <input id="pdf-dosya" type="file" accept="application/pdf" hidden>
    </label>
    <span id="sayac">⏱ <span id="sayac-sure">00:00:00</span> <button id="sayac-dugme" aria-label="Başlat">▶</button></span>
    <button id="devam" hidden title="Limit açıldıysa kalan işlere devam et">▶ Devam</button>
    <span id="ipucu">Sol tık: bak · Sağ tık / WASD: yürü · Tekerlek: yaklaş</span>
    <span id="saat"></span>
  </header>
  <div id="uyari" hidden></div>
  <main id="sahne"></main>
  <aside id="panel" hidden>
    <button id="kapat" aria-label="Paneli kapat">✕</button>
    <h2 id="panel-baslik"></h2>
    <div id="panel-icerik"></div>
  </aside>
  <dialog id="ders-formu">
    <form method="dialog" id="ders-form">
      <h3>Yeni ders</h3>
      <label>Ders adı <input name="ad" required maxlength="60" placeholder="Math 1"></label>
      <label>Sınav tarihi <input name="sinav_tarihi" type="date" required></label>
      <label>Konular (her satıra bir konu)<textarea name="konular" rows="8" placeholder="Limit&#10;Türev&#10;İntegral"></textarea></label>
      <p class="hata" id="ders-hata"></p>
      <menu><button value="iptal" formnovalidate>Vazgeç</button> <button value="ok" id="ders-kaydet">Oluştur</button></menu>
    </form>
  </dialog>
  <div id="buyut" hidden><img alt="Tam sayfa"></div>
  <script type="module" src="uygulama.js"></script>
</body>
</html>
